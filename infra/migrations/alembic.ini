# Alembic configuration. Run from the repo root:
#   uv run alembic -c infra/migrations/alembic.ini upgrade head
# The database URL is taken from core.settings (DATABASE_URL_SYNC), see env.py.
[alembic]
script_location = %(here)s
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
version_path_separator = os
timezone = UTC

[post_write_hooks]
hooks = ruff
ruff.type = exec
ruff.executable = uv
ruff.options = run ruff format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
