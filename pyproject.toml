[project]
name = "trading-platform"
version = "0.1.0"
description = "AI-powered multi-market algorithmic trading platform (workspace root)"
requires-python = ">=3.12"
dependencies = [
    "core",
    "providers",
    "market_data",
    "strategy",
    "execution",
    "risk",
    "backtest",
    "ai",
    "api",
    "worker",
    "collector",
    "trader",
]

[tool.uv.workspace]
members = ["packages/*", "apps/api", "apps/worker", "apps/collector", "apps/trader"]

[tool.uv.sources]
core = { workspace = true }
providers = { workspace = true }
market_data = { workspace = true }
strategy = { workspace = true }
execution = { workspace = true }
risk = { workspace = true }
backtest = { workspace = true }
ai = { workspace = true }
api = { workspace = true }
worker = { workspace = true }
collector = { workspace = true }
trader = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "mypy>=1.13",
    "httpx>=0.27",
    "import-linter>=2.1",
    "email-validator>=2.4.0",
    "respx>=0.23.1",
    "fakeredis[aioredis]>=2.40.0",
]

[tool.ruff]
extend-exclude = ["docs", "*_pb2.py", "*_pb2.pyi"]
line-length = 100
target-version = "py312"
src = ["packages/*/src", "apps/*/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC", "S", "DTZ", "RUF"]
ignore = ["S101", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "DTZ"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "packages/core/src:packages/providers/src:packages/market_data/src:packages/strategy/src:packages/execution/src:packages/risk/src:packages/backtest/src:packages/ai/src:apps/api/src:apps/worker/src:apps/collector/src:apps/trader/src"
namespace_packages = true
explicit_package_bases = true
exclude = ["/tests/", "_pb2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["packages", "apps"]
addopts = "-q"

[tool.importlinter]
root_packages = ["core", "providers", "market_data", "strategy", "execution", "risk", "backtest", "ai", "api", "worker", "collector", "trader"]

[[tool.importlinter.contracts]]
name = "core depends on nothing above it"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = ["providers", "api", "worker", "collector", "ai"]

[[tool.importlinter.contracts]]
name = "providers never import apps"
type = "forbidden"
source_modules = ["providers"]
forbidden_modules = ["api", "worker", "collector", "ai"]

[[tool.importlinter.contracts]]
name = "market_data never imports apps"
type = "forbidden"
source_modules = ["market_data"]
forbidden_modules = ["api", "worker", "collector", "ai"]

[[tool.importlinter.contracts]]
name = "strategy depends only on core"
type = "forbidden"
source_modules = ["strategy"]
forbidden_modules = ["providers", "market_data", "api", "worker", "collector", "ai"]

[[tool.importlinter.contracts]]
name = "risk depends only on core"
type = "forbidden"
source_modules = ["risk"]
forbidden_modules = ["providers", "market_data", "strategy", "api", "worker", "collector", "ai"]

[[tool.importlinter.contracts]]
name = "execution depends only on core"
type = "forbidden"
source_modules = ["execution"]
forbidden_modules = ["providers", "market_data", "strategy", "api", "worker", "collector", "ai"]

[[tool.importlinter.contracts]]
name = "backtest never imports apps or data providers"
type = "forbidden"
source_modules = ["backtest"]
forbidden_modules = ["providers", "market_data", "api", "worker", "collector", "trader", "ai"]

[[tool.importlinter.contracts]]
name = "ai never imports apps, data providers or the execution layer"
type = "forbidden"
source_modules = ["ai"]
forbidden_modules = ["providers", "market_data", "execution", "risk", "api", "worker", "collector", "trader"]
