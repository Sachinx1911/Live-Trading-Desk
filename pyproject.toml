[project]
name = "trading-platform"
version = "0.1.0"
description = "AI-powered multi-market algorithmic trading platform (workspace root)"
requires-python = ">=3.12"
dependencies = [
    "core",
    "providers",
    "api",
    "worker",
]

[tool.uv.workspace]
members = ["packages/*", "apps/api", "apps/worker"]

[tool.uv.sources]
core = { workspace = true }
providers = { workspace = true }
api = { workspace = true }
worker = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "mypy>=1.13",
    "httpx>=0.27",
    "import-linter>=2.1",
    "email-validator>=2.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/*/src", "apps/*/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC", "S", "DTZ", "RUF"]
ignore = ["S101", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "DTZ"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "packages/core/src:packages/providers/src:apps/api/src:apps/worker/src"
namespace_packages = true
explicit_package_bases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["packages", "apps"]
addopts = "-q"

[tool.importlinter]
root_packages = ["core", "providers", "api", "worker"]

[[tool.importlinter.contracts]]
name = "core depends on nothing above it"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = ["providers", "api", "worker"]

[[tool.importlinter.contracts]]
name = "providers never import apps"
type = "forbidden"
source_modules = ["providers"]
forbidden_modules = ["api", "worker"]
