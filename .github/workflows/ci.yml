name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      db:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_USER: trading
          POSTGRES_PASSWORD: trading
          POSTGRES_DB: trading
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trading -d trading"
          --health-interval 5s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://trading:trading@localhost:5432/trading
      DATABASE_URL_SYNC: postgresql+psycopg://trading:trading@localhost:5432/trading
      TEST_DATABASE_URL_SYNC: postgresql+psycopg://trading:trading@localhost:5432/trading
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy packages apps/api/src apps/worker/src
      - run: uv run lint-imports
      - run: uv run alembic -c infra/migrations/alembic.ini upgrade head
      - run: uv run pytest
      # NL builder evaluation set (roadmap Phase 5). The offline self-check always runs; the
      # model run and its accuracy gate need OPENAI_API_KEY (repository secret) and are skipped
      # without it. Threshold is documented in docs/progress.md.
      - run: uv run python -m ai.evals.nl_eval --threshold 0.85 --report nl-eval-report.json
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nl-eval-report
          path: nl-eval-report.json
          if-no-files-found: ignore

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
