[project]
name = "risk"
version = "0.1.0"
description = "Risk engine: limits, position sizing, pre-trade checks, kill switch, monitor rules"
requires-python = ">=3.12"
dependencies = ["core", "pydantic>=2.9", "redis>=5.2"]

[tool.uv.sources]
core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/risk"]
