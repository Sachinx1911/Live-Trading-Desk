[project]
name = "ai"
version = "0.1.0"
description = "LLM boundary (ADR-009): provider interface, OpenAI adapter, budgets, ai_calls logging, NL strategy builder, research, review, brief, auditor"
requires-python = ">=3.12"
dependencies = ["core", "strategy", "pydantic>=2.9", "httpx>=0.27", "redis>=5.2", "sqlalchemy>=2.0"]

[tool.uv.sources]
core = { workspace = true }
strategy = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai"]
