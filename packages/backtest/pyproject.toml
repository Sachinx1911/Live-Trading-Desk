[project]
name = "backtest"
version = "0.1.0"
description = "Event-driven backtester on the shared strategy engine, risk engine and execution simulator (ADR-002)"
requires-python = ">=3.12"
dependencies = ["core", "strategy", "execution", "risk", "polars>=1.12", "numpy>=2.0", "pydantic>=2.9"]

[tool.uv.sources]
core = { workspace = true }
strategy = { workspace = true }
execution = { workspace = true }
risk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backtest"]
