[project]
name = "protocols"
version = "0.1.0"
description = "Trading protocols (named bundles of registered actions) and proactive alerts; deterministic, no AI"
requires-python = ">=3.12"
dependencies = ["core", "market_data", "risk", "strategy", "pydantic>=2.9", "redis>=5.2", "orjson>=3.10"]

[tool.uv.sources]
core = { workspace = true }
market_data = { workspace = true }
risk = { workspace = true }
strategy = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/protocols"]
