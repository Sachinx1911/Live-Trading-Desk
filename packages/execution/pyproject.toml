[project]
name = "execution"
version = "0.1.0"
description = "Order state machine, execution simulator, Indian cost model, position book, live gateway"
requires-python = ">=3.12"
dependencies = ["core", "pydantic>=2.9", "httpx>=0.27"]

[tool.uv.sources]
core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/execution"]
