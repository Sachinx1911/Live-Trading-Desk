[project]
name = "strategy"
version = "0.1.0"
description = "Strategy DSL (schema, validation, examples), indicator library, strategy engine, regime detector"
requires-python = ">=3.12"
dependencies = ["core", "polars>=1.12", "numpy>=2.0", "pydantic>=2.9"]

[tool.uv.sources]
core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strategy"]
