[project]
name = "providers"
version = "0.1.0"
description = "Market data and broker provider interfaces plus adapters (fake, upstox, dhan)"
requires-python = ">=3.12"
dependencies = ["core", "httpx>=0.27", "tenacity>=9.0"]

[tool.uv.sources]
core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/providers"]
