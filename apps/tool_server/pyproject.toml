[project]
name = "tool_server"
version = "0.1.0"
description = "Mark 1 Stage 4.1 tool server: the trading catalogue over typed HTTP and MCP for the owner's jarvis; no LLM, no order path"
requires-python = ">=3.12"
dependencies = [
    "core",
    "protocols",
    "market_data",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "redis>=5.2",
    "orjson>=3.10",
    "mcp>=1.9",
]

[tool.uv.sources]
core = { workspace = true }
protocols = { workspace = true }
market_data = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tool_server"]
