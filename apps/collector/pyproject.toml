[project]
name = "collector"
version = "0.1.0"
description = "Live market data collector: feed -> 1m candles, quotes cache, option-chain snapshots"
requires-python = ">=3.12"
dependencies = ["core", "providers", "market_data", "polars>=1.12", "pyarrow>=18.0"]

[tool.uv.sources]
core = { workspace = true }
providers = { workspace = true }
market_data = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collector"]
