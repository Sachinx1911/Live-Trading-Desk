[project]
name = "worker"
version = "0.1.0"
description = "arq background worker"
requires-python = ">=3.12"
dependencies = ["core", "providers", "arq>=0.26"]

[tool.uv.sources]
core = { workspace = true }
providers = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]
