[project]
name = "trader"
version = "0.1.0"
description = "Paper trading runner: activations x live data -> strategy engine -> risk -> simulator -> DB"
requires-python = ">=3.12"
dependencies = ["core", "providers", "market_data", "strategy", "execution", "risk"]

[tool.uv.sources]
core = { workspace = true }
providers = { workspace = true }
market_data = { workspace = true }
strategy = { workspace = true }
execution = { workspace = true }
risk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trader"]
