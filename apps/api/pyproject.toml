[project]
name = "api"
version = "0.1.0"
description = "FastAPI application"
requires-python = ">=3.12"
dependencies = [
    "core",
    "providers",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "orjson>=3.10",
]

[tool.uv.sources]
core = { workspace = true }
providers = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
